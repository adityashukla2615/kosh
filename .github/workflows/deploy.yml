name: Deploy

# Runs after CI passes on main, or by hand.
# Needs one repo secret: AWS_DEPLOY_ROLE_ARN (an IAM role trusting GitHub's OIDC provider).
# Optional repo variables: AWS_REGION (default ap-south-1), BEDROCK_REGION, STAGE.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ vars.STAGE || 'demo' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  STAGE: ${{ vars.STAGE || 'demo' }}
  STACK: kosh-${{ vars.STAGE || 'demo' }}

jobs:
  deploy:
    # skipped (not failed) until AWS is wired up: set repo variable DEPLOY_ENABLED=true
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: ${{ vars.STAGE || 'demo' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build & deploy backend
        working-directory: infra
        run: |
          sam build -t template.yaml
          sam deploy \
            --stack-name "$STACK" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides Stage="$STAGE" BedrockRegion="${{ vars.BEDROCK_REGION || 'us-east-1' }}"

      - name: Read stack outputs
        id: out
        run: |
          get() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "bucket=$(get WebBucketName)" >> "$GITHUB_OUTPUT"
          echo "dist=$(get DistributionId)" >> "$GITHUB_OUTPUT"
          echo "url=$(get SiteUrl)" >> "$GITHUB_OUTPUT"

      - name: Build & upload frontend
        run: |
          npm run build
          # hashed assets can be cached forever, index.html never
          aws s3 sync web/dist "s3://${{ steps.out.outputs.bucket }}" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "s3://${{ steps.out.outputs.bucket }}/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ steps.out.outputs.dist }}" --paths "/index.html" "/"

      - name: Smoke test
        run: |
          sleep 20
          curl -fsS "${{ steps.out.outputs.url }}/api/health"
          echo
          curl -fsS -X POST -H 'content-type: application/json' -d '{"assumptions":{"simulations":200}}' \
            "${{ steps.out.outputs.url }}/api/profiles/iyer/overview" | head -c 300
          echo
          echo "Deployed: ${{ steps.out.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
