# Render blueprint: one Docker web service running the same container as `docker run`.
# Express serves the API and the built React app on a single origin, so there is no
# separate static site and no CORS to configure.
#
# Connect this repo at https://render.com/ -> New -> Blueprint. Render reads this file,
# builds the root Dockerfile and asks for the one secret marked `sync: false`.
services:
  - type: web
    name: kosh
    runtime: docker
    plan: free
    region: singapore          # closest free region to the users this is built for
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Claude API rather than Bedrock. Paste the key into the Render dashboard when
      # prompted - `sync: false` keeps it out of this file and out of git.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: PORT
        value: 8787
      # TABLE_NAME deliberately unset -> the store falls back to memory.
