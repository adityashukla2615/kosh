# Render blueprint: one Docker web service running the same container as `docker run`.
# Express serves the API and the built React app on a single origin, so there is no
# separate static site and no CORS to configure.
#
# Connect this repo at https://render.com/ -> New -> Blueprint. Render reads this file
# and builds the root Dockerfile. Nothing to fill in - the demo runs keyless.
services:
  - type: web
    name: kosh
    runtime: docker
    plan: free
    region: singapore          # closest free region to the users this is built for
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Offline planner: the advisor uses the same tools and the same engine numbers,
      # in plainer wording, with no model calls and no API bill. To put Claude behind it
      # later, add ANTHROPIC_API_KEY as a secret in the Render dashboard and flip this
      # to `anthropic` - no redeploy of the image needed, Render restarts the service.
      - key: LLM_PROVIDER
        value: offline
      - key: PORT
        value: 8787
      # TABLE_NAME deliberately unset -> the store falls back to memory.
